<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TRAIL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #0f0e17;
      color: #e0e0e0;
      font-family: monospace;
      height: 100%;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      flex-shrink: 0;
      background: #0f0e17;
      border-bottom: 1px solid #1a1a2e;
    }
    #toolbar label {
      color: #7f8c8d;
      font-size: 12px;
    }
    #levelSelect {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      flex: 1;
      min-width: 0;
      max-width: 200px;
      min-height: 32px;
    }
    #btnToggleEditor {
      background: #1a1a2e;
      color: #7f8c8d;
      border: 1px solid #333;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 32px;
    }
    #btnToggleEditor:hover { background: #2a2a4e; color: #e0e0e0; }
    #btnToggleEditor.active { border-color: #ffd700; color: #ffd700; }

    /* ── Main content (game + editor side by side on wide screens) ── */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Game area ── */
    #game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      position: relative;
    }
    #canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #sequence {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 18px;
      padding: 3px 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* ── D-pad ── */
    #dpad {
      display: none;
      flex-shrink: 0;
      padding: 8px;
      padding-bottom: 12px;
    }
    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
      margin: 0 auto;
    }
    .dpad-btn {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active { background: #2a2a4e; transform: scale(0.92); }
    .dpad-btn.dpad-action { font-size: 13px; background: #12122a; }
    .dpad-btn.dpad-empty { background: transparent; border-color: transparent; pointer-events: none; }
    @media (pointer: coarse) {
      #dpad { display: flex; justify-content: center; }
    }
    .dpad-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }
    .dpad-actions .dpad-btn {
      width: 72px;
      height: 40px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* ── Editor panel ── */
    #editor-panel {
      display: none;
      flex-direction: column;
      width: 380px;
      min-width: 300px;
      max-width: 50vw;
      border-left: 1px solid #333;
      background: #0f0e17;
      overflow: hidden;
      flex-shrink: 0;
    }
    #editor-panel.open {
      display: flex;
    }

    /* On narrow screens: editor panel goes below game, full width */
    @media (max-width: 700px) {
      #main-content { flex-direction: column; }
      #editor-panel {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        border-left: none;
        border-top: 1px solid #333;
        height: 55vh;
        flex-shrink: 0;
      }
      /* When editor is open, shrink game area */
      #editor-panel.open ~ #game-area,
      #main-content.editor-open #game-area {
        flex: 0 0 auto;
        height: 45vh;
      }
    }

    .editor-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .editor-header h3 {
      font-size: 13px;
      color: #ffd700;
      margin-right: 4px;
    }
    .editor-header button, .editor-header select {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 3px 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .editor-header button:hover { background: #2a2a4e; }

    #editor-palette {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 120px;
    }
    .tile-btn {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tile-btn:hover { background: #2a2a4e; }
    .tile-btn.active { border-color: #ffd700; color: #ffd700; }
    .tile-btn .swatch {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 2px;
      margin-right: 3px;
      vertical-align: middle;
    }

    #editor-mode-indicator {
      font-size: 11px;
      color: #ffd700;
      padding: 2px 10px;
      min-height: 16px;
      flex-shrink: 0;
    }

    #editor-textarea {
      flex: 1;
      background: #111120;
      color: #e0e0e0;
      border: none;
      border-top: 1px solid #222;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      tab-size: 2;
      min-height: 0;
      outline: none;
    }

    .editor-footer {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-top: 1px solid #222;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #editor-error { color: #e74c3c; font-size: 11px; flex: 1; }
    #editor-status { color: #7f8c8d; font-size: 11px; }

    /* Editor canvas (preview) sits in the game area when editor is open */
    /* We reuse the main canvas; editor preview uses a small overlay canvas */
    #editor-preview-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 4px 0;
      flex-shrink: 0;
      border-top: 1px solid #222;
      max-height: 200px;
      overflow: hidden;
    }
    #editor-preview-wrap.visible { display: flex; }
    #editor-canvas {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      max-width: 100%;
    }
    #editor-seq {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 16px;
      padding: 2px 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <label>关卡:</label>
      <select id="levelSelect"></select>
      <button id="btnToggleEditor">编辑器</button>
    </div>

    <div id="main-content">
      <!-- Game Area -->
      <div id="game-area">
        <div id="canvas-wrapper">
          <canvas id="gameCanvas"></canvas>
        </div>
        <div id="sequence"></div>
        <!-- D-pad (shown on touch devices) -->
        <div id="dpad">
          <div>
            <div class="dpad-grid">
              <div class="dpad-btn dpad-empty"></div>
              <div class="dpad-btn" id="btn-up">▲</div>
              <div class="dpad-btn dpad-empty"></div>
              <div class="dpad-btn" id="btn-left">◀</div>
              <div class="dpad-btn dpad-action" id="btn-undo">↩</div>
              <div class="dpad-btn" id="btn-right">▶</div>
              <div class="dpad-btn dpad-empty"></div>
              <div class="dpad-btn" id="btn-down">▼</div>
              <div class="dpad-btn dpad-empty"></div>
            </div>
            <div class="dpad-actions">
              <div class="dpad-btn dpad-action" id="btn-restart">重来</div>
              <div class="dpad-btn dpad-action" id="btn-prev">上关</div>
              <div class="dpad-btn dpad-action" id="btn-next">下关</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Editor Panel -->
      <div id="editor-panel">
        <div class="editor-header">
          <h3>编辑器</h3>
          <select id="ed-load-level"><option value="">加载关卡…</option></select>
          <button id="ed-btn-test">▶ 试玩</button>
          <button id="ed-btn-solution">▶ 解法</button>
          <button id="ed-btn-reset">↺ 重置</button>
          <button id="ed-btn-load-current">← 当前关卡</button>
          <button id="ed-btn-save">💾 保存文件</button>
        </div>
        <div id="editor-palette"></div>
        <div id="editor-mode-indicator"></div>
        <div id="editor-seq"></div>
        <div id="editor-preview-wrap">
          <canvas id="editor-canvas"></canvas>
        </div>
        <textarea id="editor-textarea" spellcheck="false">// world: 1
// title: My Level
// gate: rb

. . b r . #
S . # # G E
. . r b . #

// solution: sddddwd
</textarea>
        <div class="editor-footer">
          <span id="editor-error"></span>
          <span id="editor-status">点击格子放置 · 方向键试玩 · Z撤销 · R重置</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Game, DIR } from './src/game.js';
    import { Renderer } from './src/renderer.js';
    import { loadLevelsBrowser, LEVEL_FILES, LEVEL_TEXTS, parseLevelText } from './src/levels.js';

    // ═══════════════════════════════════════════════
    //  GAME STATE
    // ═══════════════════════════════════════════════
    let currentLevelIndex = 0;
    let game = null;
    let renderer = null;
    let LEVELS = [];

    const CHAR_COLOR = { U: '#3498db', A: '#2ecc71', S: '#e74c3c', T: '#9b59b6' };
    function charColor(c) { return CHAR_COLOR[c] || '#e0e0e0'; }

    function loadLevel(index) {
      if (index < 0 || index >= LEVELS.length) return;
      currentLevelIndex = index;
      game = new Game(LEVELS[index]);
      render();
      document.getElementById('levelSelect').value = index;
    }

    function render() {
      if (!game || !renderer) return;
      renderer.render(game.getState());
      renderSequence();
    }

    function renderSequence() {
      const el = document.getElementById('sequence');
      if (!el || !game) return;
      const snake = game.getActiveSnake();
      let html = '';
      for (const seg of snake) {
        if (!seg.char) continue;
        const bg = charColor(seg.char);
        html += `<span style="display:inline-block;min-width:16px;height:16px;border-radius:3px;background:${bg};color:#000;font-size:10px;font-weight:bold;text-align:center;line-height:16px;padding:0 2px;margin:0 1px;" title="${seg.char}">${seg.char}</span>`;
      }
      el.innerHTML = html;
    }

    function handleKey(e) {
      // Don't steal keys when editor textarea is focused
      if (document.activeElement === document.getElementById('editor-textarea')) return;
      if (!game) return;
      const key = e.key;
      let handled = true;

      if (key === 'n' || key === 'N') {
        if (game.won || e.shiftKey) loadLevel(currentLevelIndex + 1);
        return;
      }
      if (key === 'p' || key === 'P') { loadLevel(currentLevelIndex - 1); return; }

      if (game.phase === 'delegate_select') {
        const idx = parseInt(key) - 1;
        if (idx >= 0) game.selectInstruction(idx);
        render(); return;
      }

      const dirMap = {
        ArrowUp: DIR.UP, ArrowDown: DIR.DOWN,
        ArrowLeft: DIR.LEFT, ArrowRight: DIR.RIGHT,
        w: DIR.UP, s: DIR.DOWN, a: DIR.LEFT, d: DIR.RIGHT,
        W: DIR.UP, S: DIR.DOWN, A: DIR.LEFT, D: DIR.RIGHT,
      };
      if (dirMap[key]) {
        game.move(dirMap[key]);
        if (game.phase === 'in_portal' && game.portalGame?.won) game._exitPortal();
      }
      else if (key === 'z' || key === 'Z') game.undo();
      else if (key === 'r' || key === 'R') game.restart();
      else if (key === 'Backspace') { game.rewind(); e.preventDefault(); }
      else if (key === 'Tab') { game.switchBranch(); e.preventDefault(); }
      else handled = false;

      if (handled) render();
    }

    // ═══════════════════════════════════════════════
    //  EDITOR STATE
    // ═══════════════════════════════════════════════
    let editorGame = null;
    let editorLevelDef = null;
    let editorRenderer = null;
    let selectedTile = null;
    let isDrawing = false;

    const editorEl      = document.getElementById('editor-textarea');
    const editorErrorEl = document.getElementById('editor-error');
    const editorStatusEl= document.getElementById('editor-status');
    const editorModeEl  = document.getElementById('editor-mode-indicator');
    const editorSeqEl   = document.getElementById('editor-seq');
    const editorCanvas  = document.getElementById('editor-canvas');
    const editorPreviewWrap = document.getElementById('editor-preview-wrap');
    const editorPanel   = document.getElementById('editor-panel');
    const editorPaletteEl = document.getElementById('editor-palette');

    const TILES = [
      { token: '.', label: '空', color: null },
      { token: '#', label: '墙', color: '#0a0a15' },
      { token: '^', label: '起', color: null },
      { token: 'E', label: '终', color: '#ffd700' },
      { token: 'G', label: '门', color: '#4a4a5a' },
      { token: 'U', label: 'U用户', color: '#3498db' },
      { token: 'A', label: 'A助手', color: '#2ecc71' },
      { token: 'S', label: 'S系统', color: '#e74c3c' },
      { token: 'T', label: 'T思考', color: '#9b59b6' },
      { token: '✨', label: '✨解码', color: '#00bcd4' },
      { token: '!a', label: '!开关', color: null },
      { token: '|a', label: '|墙', color: '#8b4513' },
      { token: 'F', label: 'F叉', color: '#ff9800' },
      { token: '@', label: '@传', color: '#9b59b6' },
      { token: '$', label: '$派', color: '#e91e63' },
      { token: '◇', label: '◇通', color: '#888' },
      { token: '*S', label: '★记忆', color: '#f39c12' },
    ];

    function buildEditorPalette() {
      for (const tile of TILES) {
        const btn = document.createElement('button');
        btn.className = 'tile-btn';
        btn.dataset.token = tile.token;
        let inner = '';
        if (tile.color) inner += `<span class="swatch" style="background:${tile.color}"></span>`;
        inner += tile.label;
        btn.innerHTML = inner;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedTile = tile.token;
          editorModeEl.textContent = `画笔: ${tile.label} (${tile.token})`;
        });
        editorPaletteEl.appendChild(btn);
      }
    }

    function editorParseAndRender() {
      try {
        editorLevelDef = parseLevelText(editorEl.value);
        editorErrorEl.textContent = '';
        editorGame = new Game(editorLevelDef);
        editorRender();
      } catch (e) {
        editorErrorEl.textContent = e.message;
      }
    }

    function editorRender() {
      if (!editorGame || !editorRenderer) return;
      editorRenderer.render(editorGame.getState());
      editorStatusEl.textContent = editorGame.won ? '✓ 通关！' :
        `蛇长: ${editorGame.getActiveSnake().length}` + (editorGame.phase !== 'playing' ? ` · ${editorGame.phase}` : '');
      editorRenderSequence();
    }

    function editorRenderSequence() {
      if (!editorGame) { editorSeqEl.innerHTML = ''; return; }
      const snake = editorGame.getActiveSnake();
      let html = '<span style="color:#7f8c8d;font-size:11px;margin-right:4px;">序列:</span>';
      for (const seg of snake) {
        if (!seg.char) continue;
        const bg = charColor(seg.char);
        html += `<span style="display:inline-block;min-width:16px;height:16px;border-radius:3px;background:${bg};color:#000;font-size:10px;font-weight:bold;text-align:center;line-height:16px;padding:0 2px;margin:0 1px;flex-shrink:0;" title="${seg.char}">${seg.char}</span>`;
      }
      editorSeqEl.innerHTML = html;
    }

    function isMetaLine(line) {
      const t = line.trim();
      return !t || t.startsWith('//');
    }

    function updateCellInText(gx, gy, token) {
      const text = editorEl.value;
      const lines = text.split('\n');
      const mapStart = lines.findIndex(l => !isMetaLine(l));
      if (mapStart < 0) return;
      let mapRow = 0, lineIdx = -1;
      for (let i = mapStart; i < lines.length; i++) {
        if (isMetaLine(lines[i])) continue;
        if (mapRow === gy) { lineIdx = i; break; }
        mapRow++;
      }
      if (lineIdx < 0) return;
      const tokens = lines[lineIdx].split(/\s+/).filter(t => t.length > 0);
      while (tokens.length <= gx) tokens.push('.');
      tokens[gx] = token;
      lines[lineIdx] = tokens.join(' ');
      editorEl.value = lines.join('\n');
      editorParseAndRender();
    }

    function setupEditorCanvas() {
      editorCanvas.addEventListener('click', (e) => {
        if (!selectedTile || !editorLevelDef) return;
        const rect = editorCanvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) - editorRenderer.offsetX;
        const cy = (e.clientY - rect.top) - editorRenderer.offsetY;
        const CELL = editorRenderer.cell || 56;
        const gx = Math.floor(cx / CELL), gy = Math.floor(cy / CELL);
        if (gx < 0 || gx >= editorLevelDef.width || gy < 0 || gy >= editorLevelDef.height) return;
        updateCellInText(gx, gy, selectedTile);
      });
      editorCanvas.addEventListener('mousedown', () => { isDrawing = true; });
      editorCanvas.addEventListener('mouseup', () => { isDrawing = false; });
      editorCanvas.addEventListener('mouseleave', () => { isDrawing = false; });
      editorCanvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || !selectedTile || !editorLevelDef) return;
        const rect = editorCanvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) - editorRenderer.offsetX;
        const cy = (e.clientY - rect.top) - editorRenderer.offsetY;
        const CELL = editorRenderer.cell || 56;
        const gx = Math.floor(cx / CELL), gy = Math.floor(cy / CELL);
        if (gx < 0 || gx >= editorLevelDef.width || gy < 0 || gy >= editorLevelDef.height) return;
        updateCellInText(gx, gy, selectedTile);
      });
    }

    // Editor keyboard
    const DIR_MAP = {
      ArrowUp: DIR.UP, ArrowDown: DIR.DOWN,
      ArrowLeft: DIR.LEFT, ArrowRight: DIR.RIGHT,
      w: DIR.UP, s: DIR.DOWN, a: DIR.LEFT, d: DIR.RIGHT,
      W: DIR.UP, S: DIR.DOWN, A: DIR.LEFT, D: DIR.RIGHT,
    };
    window.addEventListener('keydown', (e) => {
      if (!editorPanel.classList.contains('open')) return;
      if (document.activeElement === editorEl) return;
      if (!editorGame) return;

      if (DIR_MAP[e.key]) {
        editorGame.move(DIR_MAP[e.key]);
        if (editorGame.phase === 'in_portal' && editorGame.portalGame?.won) editorGame._exitPortal();
        editorRender(); e.preventDefault();
      } else if (e.key === 'z' || e.key === 'Z') {
        editorGame.undo(); editorRender();
      } else if (e.key === 'r' || e.key === 'R') {
        editorGame.restart(); editorRender();
      } else if (e.key === 'Backspace') {
        editorGame.rewind(); editorRender(); e.preventDefault();
      } else if (e.key === 'Tab') {
        editorGame.switchBranch(); editorRender(); e.preventDefault();
      } else if ('123'.includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        if (editorGame.phase === 'merge_select') editorGame.selectBranch(idx);
        else if (editorGame.phase === 'delegate_select') editorGame.selectInstruction(idx);
        editorRender();
      } else if (e.key === 'Escape') {
        selectedTile = null;
        document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
        editorModeEl.textContent = '';
      }
    });

    // Editor toolbar buttons
    document.getElementById('ed-btn-test').addEventListener('click', () => {
      selectedTile = null;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
      editorModeEl.textContent = '试玩模式 (方向键操作)';
      editorParseAndRender();
    });
    document.getElementById('ed-btn-reset').addEventListener('click', () => {
      if (editorGame) { editorGame.restart(); editorRender(); }
    });
    document.getElementById('ed-btn-solution').addEventListener('click', () => {
      editorParseAndRender();
      if (!editorLevelDef?.solution || !editorGame) {
        editorErrorEl.textContent = '没有解法（在 // solution: 中定义）';
        return;
      }
      const DM = { w: DIR.UP, a: DIR.LEFT, s: DIR.DOWN, d: DIR.RIGHT };
      let i = 0;
      const sol = editorLevelDef.solution;
      function step() {
        if (i >= sol.length || editorGame.won) { editorRender(); return; }
        const ch = sol[i++];
        if (DM[ch]) {
          const r = editorGame.move(DM[ch]);
          if (!r.success && editorGame.phase !== 'won') {
            editorErrorEl.textContent = `解法失败: 步骤 ${i} '${ch}': ${r.reason}`;
            editorRender(); return;
          }
        } else if (ch === '<') editorGame.rewind();
        else if (ch === 't') editorGame.switchBranch();
        else if ('123'.includes(ch)) {
          const idx = parseInt(ch) - 1;
          if (editorGame.phase === 'merge_select') editorGame.selectBranch(idx);
          else if (editorGame.phase === 'delegate_select') editorGame.selectInstruction(idx);
        }
        editorRender();
        setTimeout(step, 150);
      }
      step();
    });

    // Load current game level into editor
    document.getElementById('ed-btn-load-current').addEventListener('click', () => {
      const name = LEVEL_FILES[currentLevelIndex];
      if (name && LEVEL_TEXTS[name]) {
        editorEl.value = LEVEL_TEXTS[name];
        editorParseAndRender();
      }
    });

    // Save as .txt file
    document.getElementById('ed-btn-save').addEventListener('click', () => {
      const text = editorEl.value;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const title = (editorLevelDef?.title || 'level').replace(/\s+/g, '-');
      a.href = url;
      a.download = `${title}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Load level from dropdown in editor
    const edLoadSelect = document.getElementById('ed-load-level');
    LEVEL_FILES.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      edLoadSelect.appendChild(opt);
    });
    edLoadSelect.addEventListener('change', (e) => {
      if (!e.target.value) return;
      const name = e.target.value;
      if (LEVEL_TEXTS[name]) {
        editorEl.value = LEVEL_TEXTS[name];
        editorParseAndRender();
      }
      edLoadSelect.value = '';
    });

    // Live parse editor textarea
    let debounce = null;
    editorEl.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(editorParseAndRender, 300);
    });

    // Toggle editor panel
    const btnToggle = document.getElementById('btnToggleEditor');
    btnToggle.addEventListener('click', () => {
      const open = editorPanel.classList.toggle('open');
      btnToggle.classList.toggle('active', open);
      if (open) {
        // Init editor renderer lazily
        if (!editorRenderer) {
          editorRenderer = new Renderer(editorCanvas);
          setupEditorCanvas();
          buildEditorPalette();
          editorParseAndRender();
        }
        editorPreviewWrap.classList.add('visible');
        // re-render game (size changed)
        requestAnimationFrame(() => render());
      } else {
        editorPreviewWrap.classList.remove('visible');
        requestAnimationFrame(() => render());
      }
    });

    // ═══════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', async () => {
      const canvas = document.getElementById('gameCanvas');
      renderer = new Renderer(canvas);

      LEVELS = await loadLevelsBrowser();

      const select = document.getElementById('levelSelect');
      LEVELS.forEach((level, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${level.world}. ${level.title}`;
        select.appendChild(opt);
      });
      select.addEventListener('change', (e) => loadLevel(parseInt(e.target.value)));

      window.addEventListener('keydown', handleKey);

      // D-pad buttons
      const dpadMap = [
        ['btn-up', DIR.UP], ['btn-down', DIR.DOWN],
        ['btn-left', DIR.LEFT], ['btn-right', DIR.RIGHT],
      ];
      for (const [id, dir] of dpadMap) {
        document.getElementById(id)?.addEventListener('click', () => {
          if (!game) return;
          game.move(dir);
          if (game.phase === 'in_portal' && game.portalGame?.won) game._exitPortal();
          render();
        });
      }
      document.getElementById('btn-undo')?.addEventListener('click', () => { game?.undo(); render(); });
      document.getElementById('btn-restart')?.addEventListener('click', () => { game?.restart(); render(); });
      document.getElementById('btn-prev')?.addEventListener('click', () => loadLevel(currentLevelIndex - 1));
      document.getElementById('btn-next')?.addEventListener('click', () => {
        if (game?.won || true) loadLevel(currentLevelIndex + 1);
      });

      loadLevel(0);
    });

    // Resize: re-render on window resize
    window.addEventListener('resize', () => {
      render();
      if (editorRenderer && editorGame) editorRender();
    });
  </script>
</body>
</html>
