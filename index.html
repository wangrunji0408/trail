<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TRAIL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #0f0e17;
      color: #e0e0e0;
      font-family: monospace;
      height: 100%;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      flex-shrink: 0;
      background: #0d0c14;
      border-bottom: 1px solid #1a1a2e;
    }
    #toolbar label { color: #7f8c8d; font-size: 12px; flex-shrink: 0; }
    #levelSelect {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 4px 6px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      flex: 1;
      min-width: 0;
      min-height: 30px;
    }
    .tb-btn {
      background: #1a1a2e;
      color: #7f8c8d;
      border: 1px solid #333;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 30px;
      flex-shrink: 0;
    }
    .tb-btn:hover { background: #2a2a4e; color: #e0e0e0; }
    .tb-btn.active { border-color: #ffd700; color: #ffd700; }

    /* ── Main area ── */
    #main-area {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Game panel ── */
    #game-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    #canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #sequence {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 16px;
      padding: 2px 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* ── D-pad ── */
    #dpad {
      display: none;
      flex-shrink: 0;
      padding: 6px 8px 10px;
      justify-content: center;
    }
    @media (pointer: coarse) {
      #dpad { display: flex; }
    }
    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .dpad-btn {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active { background: #2a2a4e; transform: scale(0.9); }
    .dpad-btn.dpad-action { font-size: 12px; background: #111128; }
    .dpad-btn.dpad-empty { background: transparent; border-color: transparent; pointer-events: none; }
    .dpad-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 5px;
    }
    .dpad-actions .dpad-btn {
      width: 68px;
      height: 36px;
      font-size: 11px;
      border-radius: 6px;
    }

    /* ── Editor panel ── */
    /* Editor always uses position:fixed so it never affects the flex layout */
    #editor-panel {
      display: none;
      flex-direction: column;
      position: fixed;
      bottom: 0;
      right: 0;
      width: 360px;
      min-width: 280px;
      max-width: 50vw;
      max-height: 80vh;
      border-left: 2px solid #2a2a4e;
      border-top: 2px solid #2a2a4e;
      background: #0d0c14;
      overflow: hidden;
      z-index: 100;
    }
    #editor-panel.open { display: flex; }

    /* On small screens (phone portrait), editor spans full width over D-pad */
    @media (max-width: 600px) {
      #editor-panel.open {
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100%;
        max-height: 60vh;
        border-left: none;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* On mobile, textarea is hidden by default; shown when toggled */
      #ep-textarea-section {
        display: none !important;
      }
      #ep-textarea-section.expanded {
        display: flex !important;
        flex-direction: column;
        min-height: 180px;
      }
    }

    .ep-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #2a2a4e;
      flex-shrink: 0;
    }
    .ep-header h2 { font-size: 13px; color: #ffd700; flex: 1; }
    .ep-close {
      background: transparent;
      border: none;
      color: #7f8c8d;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
    .ep-close:hover { color: #e0e0e0; }

    .ep-toolbar {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-bottom: 1px solid #1a1a2e;
      flex-shrink: 0;
    }
    .ep-btn {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .ep-btn:hover { background: #2a2a4e; }

    #ep-palette {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-bottom: 1px solid #1a1a2e;
      flex-shrink: 0;
    }
    .tile-btn {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 3px 7px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tile-btn:hover { background: #2a2a4e; }
    .tile-btn.active { border-color: #ffd700; color: #ffd700; }
    .tile-btn .swatch {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 2px;
      margin-right: 3px;
      vertical-align: middle;
    }

    #ep-mode { font-size: 11px; color: #ffd700; padding: 2px 8px; flex-shrink: 0; min-height: 16px; }
    #ep-error { font-size: 11px; color: #e74c3c; padding: 2px 8px; min-height: 16px; flex-shrink: 0; }

    #ep-textarea-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #ep-textarea {
      flex: 1;
      background: #1a1a2e;
      color: #e0e0e0;
      border: none;
      border-top: 1px solid #1a1a2e;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
      min-height: 120px;
    }

    .ep-actions {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-top: 1px solid #1a1a2e;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .ep-actions .ep-btn { flex: 1; text-align: center; min-width: 80px; }
    .ep-actions .ep-btn.primary { border-color: #ffd700; color: #ffd700; font-size: 13px; font-weight: bold; }
    /* On desktop, hide the source toggle button (textarea always visible) */
    @media (min-width: 601px) {
      #ep-source-toggle { display: none; }
    }

    /* Size controls */
    #ep-size {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-bottom: 1px solid #1a1a2e;
      flex-shrink: 0;
      font-size: 12px;
      color: #7f8c8d;
      flex-wrap: wrap;
    }
    #ep-size span { color: #e0e0e0; }
    .size-btn {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      width: 22px;
      height: 22px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    .size-btn:hover { background: #2a2a4e; }
    #ep-size .sep { color: #333; margin: 0 2px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <label>关卡:</label>
    <select id="levelSelect"></select>
    <button class="tb-btn" id="btnNewLevel">+ 新关卡</button>
    <button class="tb-btn" id="btnEditor">编辑器</button>
  </div>

  <!-- Main area: game + optional editor panel -->
  <div id="main-area">
    <!-- Game panel -->
    <div id="game-panel">
      <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div id="sequence"></div>
      <!-- D-pad (touch devices) -->
      <div id="dpad">
        <div>
          <div class="dpad-grid">
            <div class="dpad-btn dpad-empty"></div>
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn dpad-empty"></div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn dpad-action" id="btn-undo">↩</div>
            <div class="dpad-btn" id="btn-right">▶</div>
            <div class="dpad-btn dpad-empty"></div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div class="dpad-btn dpad-empty"></div>
          </div>
          <div class="dpad-actions">
            <div class="dpad-btn dpad-action" id="btn-restart">重来</div>
            <div class="dpad-btn dpad-action" id="btn-prev">上关</div>
            <div class="dpad-btn dpad-action" id="btn-next">下关</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Editor panel (hidden by default) -->
    <div id="editor-panel">
      <div class="ep-header">
        <h2>关卡编辑器</h2>
        <button class="ep-close" id="ep-close-btn" title="关闭">✕</button>
      </div>
      <div class="ep-toolbar">
        <button class="ep-btn" id="ep-test">▶ 试玩</button>
        <button class="ep-btn" id="ep-solution">▶ 解法</button>
        <button class="ep-btn" id="ep-reset">↺ 重置</button>
      </div>
      <div id="ep-palette"></div>
      <div id="ep-size">
        <span>宽:</span>
        <button class="size-btn" id="ep-w-dec">−</button>
        <span id="ep-w-val">?</span>
        <button class="size-btn" id="ep-w-inc">+</button>
        <span class="sep">|</span>
        <span>高:</span>
        <button class="size-btn" id="ep-h-dec">−</button>
        <span id="ep-h-val">?</span>
        <button class="size-btn" id="ep-h-inc">+</button>
      </div>
      <div id="ep-mode"></div>
      <div id="ep-error"></div>
      <div id="ep-textarea-section">
        <textarea id="ep-textarea" spellcheck="false">// world: 1
// title: My Level
// gate: rb

. . b r . #
S . # # G E
. . r b . #

// solution: sddddwd
</textarea>
      </div>
      <div class="ep-actions">
        <button class="ep-btn" id="ep-source-toggle">📄 查看源码</button>
        <button class="ep-btn" id="ep-load-level">加载当前关卡</button>
        <button class="ep-btn primary" id="ep-save">💾 保存</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
