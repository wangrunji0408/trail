<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAIL - Level Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0e17;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      height: 100vh;
    }
    #left {
      width: 42%;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      border-right: 1px solid #333;
      min-width: 340px;
    }
    #right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 8px;
    }
    h2 { font-size: 16px; color: #ffd700; }
    #toolbar, #palette {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    button, .tile-btn {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover, .tile-btn:hover { background: #2a2a4e; }
    .tile-btn.active { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 4px rgba(255,215,0,0.3); }
    .tile-btn .swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }
    #editor {
      flex: 1;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      border-radius: 4px;
      tab-size: 2;
    }
    #error { color: #e74c3c; font-size: 12px; min-height: 18px; }
    #legend { font-size: 11px; color: #7f8c8d; line-height: 1.4; }
    #sequence {
      display: flex;
      align-items: center;
      gap: 3px;
      min-height: 24px;
      flex-wrap: wrap;
      padding: 4px 0;
    }
    #sequence .seq-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    #sequence .seq-dot.shadow { opacity: 0.35; }
    #sequence .seq-dot.preset { border-style: dashed; }
    #sequence .seq-label { color: #7f8c8d; font-size: 11px; margin-right: 4px; }
    canvas { display: block; cursor: crosshair; }
    #status { color: #7f8c8d; font-size: 12px; min-height: 18px; }
    #modeIndicator { font-size: 12px; color: #ffd700; min-height: 18px; }
    select {
      background: #1a1a2e; color: #e0e0e0; border: 1px solid #333;
      padding: 4px 8px; font-family: monospace; font-size: 13px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="left">
    <h2>TRAIL Level Editor</h2>
    <div id="toolbar">
      <select id="loadLevel"><option value="">加载关卡...</option></select>
      <button id="btnSave">💾 保存</button>
      <button id="btnTest">▶ 试玩</button>
      <button id="btnSolution">▶ 解法</button>
      <button id="btnReset">↺ 重置</button>
    </div>
    <div id="palette"></div>
    <div id="modeIndicator"></div>
    <textarea id="editor" spellcheck="false">// world: 1
// title: My Level
// gate: rb

. . b r . #
S . # # G E
. . r b . #

// solution: sddddwd
</textarea>
    <div id="error"></div>
    <div id="legend">
      <b>解法:</b> w↑ a← s↓ d→ &lt;倒带 t切换分支 1/2选择 {子空间} [分支]
    </div>
  </div>
  <div id="right">
    <canvas id="gameCanvas"></canvas>
    <div id="sequence"></div>
    <div id="status">点击格子放置 · 方向键试玩 · Z撤销 · R重置</div>
  </div>

  <script type="module">
    import { parseLevelText } from './src/parser.js';
    import { Game, DIR } from './src/game.js';
    import { Renderer } from './src/renderer.js';

    const editorEl = document.getElementById('editor');
    const errorEl = document.getElementById('error');
    const statusEl = document.getElementById('status');
    const modeEl = document.getElementById('modeIndicator');
    const canvas = document.getElementById('gameCanvas');
    const renderer = new Renderer(canvas);
    const loadSelect = document.getElementById('loadLevel');
    const paletteEl = document.getElementById('palette');

    const sequenceEl = document.getElementById('sequence');

    let game = null;
    let levelDef = null;
    let selectedTile = null; // current brush
    let editMode = true; // true=edit, false=play

    // === Tile palette ===
    const TILES = [
      { token: '.', label: '空', color: null },
      { token: '#', label: '墙', color: '#0a0a15' },
      { token: 'S', label: '起', color: null },
      { token: 'E', label: '终', color: '#ffd700' },
      { token: 'r', label: '红', color: '#e74c3c' },
      { token: 'b', label: '蓝', color: '#3498db' },
      { token: 'g', label: '绿', color: '#2ecc71' },
      { token: 'y', label: '黄', color: '#f1c40f' },
      { token: 'G', label: '门', color: '#4a4a5a' },
      { token: 'C', label: 'C', color: '#00bcd4' },
      { token: '!a', label: '!开关', color: null },
      { token: '|a', label: '|墙', color: '#8b4513' },
      { token: '~', label: '~暗', color: '#8000ff' },
      { token: '~b', label: '~蓝', color: '#8844cc' },
      { token: 'F', label: 'F叉', color: '#ff9800' },
      { token: 'M', label: 'M合', color: '#ff9800' },
      { token: '@', label: '@传', color: '#9b59b6' },
      { token: '$', label: '$派', color: '#e91e63' },
      { token: 'Dr', label: 'D红', color: '#e74c3c' },
      { token: 'Dg', label: 'D绿', color: '#2ecc71' },
      { token: '◇', label: '◇', color: '#888' },
      { token: '*r', label: '★红', color: '#f39c12' },
    ];

    for (const tile of TILES) {
      const btn = document.createElement('button');
      btn.className = 'tile-btn';
      btn.dataset.token = tile.token;
      let inner = '';
      if (tile.color) inner += `<span class="swatch" style="background:${tile.color}"></span>`;
      inner += tile.label;
      btn.innerHTML = inner;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTile = tile.token;
        editMode = true;
        modeEl.textContent = `画笔: ${tile.label} (${tile.token})`;
      });
      paletteEl.appendChild(btn);
    }

    // === Level file loader ===
    const LEVEL_FILES = [
      '1-growth', '2-echo', '3-prism', '4-shadow', '5-fork',
      '6-rewind', '7-forgetting', '8-portal', '9-subagent',
    ];
    LEVEL_FILES.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      loadSelect.appendChild(opt);
    });
    loadSelect.addEventListener('change', async (e) => {
      if (!e.target.value) return;
      editorEl.value = await (await fetch(`levels/${e.target.value}.txt`)).text();
      parseAndRender();
      loadSelect.value = '';
    });

    // === Parse & render ===
    function parseAndRender() {
      try {
        levelDef = parseLevelText(editorEl.value);
        errorEl.textContent = '';
        game = new Game(levelDef);
        render();
      } catch (e) {
        errorEl.textContent = e.message;
      }
    }

    function render() {
      if (!game) return;
      renderer.render(game.getState());
      statusEl.textContent = game.won ? '✓ 通关！' :
        `蛇长: ${game.snake.length}` + (game.phase !== 'playing' ? ` · ${game.phase}` : '');
      renderSequence();
    }

    const COLOR_HEX = { red: '#e74c3c', blue: '#3498db', green: '#2ecc71', yellow: '#f1c40f' };

    function renderSequence() {
      if (!game) { sequenceEl.innerHTML = ''; return; }
      const snake = game.getActiveSnake();
      let html = '<span class="seq-label">序列:</span>';
      for (const seg of snake) {
        if (!seg.color) continue;
        const bg = COLOR_HEX[seg.color] || '#888';
        let cls = 'seq-dot';
        if (seg.isShadow) cls += ' shadow';
        if (seg.isPreset) cls += ' preset';
        html += `<div class="${cls}" style="background:${bg}" title="${seg.color}${seg.isShadow ? ' (暗)' : ''}${seg.isPreset ? ' (自动)' : ''}"></div>`;
      }
      sequenceEl.innerHTML = html;
    }

    let debounce = null;
    editorEl.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(parseAndRender, 300);
    });

    // === Canvas click → place tile ===
    canvas.addEventListener('click', (e) => {
      if (!selectedTile || !levelDef) return;
      const rect = canvas.getBoundingClientRect();
      const scale = devicePixelRatio;
      const cx = (e.clientX - rect.left) - renderer.offsetX;
      const cy = (e.clientY - rect.top) - renderer.offsetY;
      const CELL = 56;
      const gx = Math.floor(cx / CELL);
      const gy = Math.floor(cy / CELL);
      if (gx < 0 || gx >= levelDef.width || gy < 0 || gy >= levelDef.height) return;

      updateCellInText(gx, gy, selectedTile);
    });

    // Also support click-drag
    let isDrawing = false;
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; });
    canvas.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !selectedTile || !levelDef) return;
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) - renderer.offsetX;
      const cy = (e.clientY - rect.top) - renderer.offsetY;
      const CELL = 56;
      const gx = Math.floor(cx / CELL);
      const gy = Math.floor(cy / CELL);
      if (gx < 0 || gx >= levelDef.width || gy < 0 || gy >= levelDef.height) return;
      updateCellInText(gx, gy, selectedTile);
    });

    function isMetaLine(line) {
      const t = line.trim();
      return !t || t.startsWith('//');
    }

    function updateCellInText(gx, gy, token) {
      const text = editorEl.value;
      const lines = text.split('\n');

      // Find first map line (non-meta, non-empty)
      const mapStart = lines.findIndex(l => !isMetaLine(l));
      if (mapStart < 0) return;

      // Find the map line for row gy
      let mapRow = 0;
      let lineIdx = -1;
      for (let i = mapStart; i < lines.length; i++) {
        if (isMetaLine(lines[i])) continue;
        if (mapRow === gy) { lineIdx = i; break; }
        mapRow++;
      }
      if (lineIdx < 0) return;

      // Parse the line into tokens
      const tokens = lines[lineIdx].split(/\s+/).filter(t => t.length > 0);

      // Pad if needed
      while (tokens.length <= gx) tokens.push('.');

      // Replace token
      tokens[gx] = token;

      // Rebuild line
      lines[lineIdx] = tokens.join(' ');
      editorEl.value = lines.join('\n');
      parseAndRender();
    }

    // === Keyboard: play mode ===
    const DIR_MAP = {
      ArrowUp: DIR.UP, ArrowDown: DIR.DOWN,
      ArrowLeft: DIR.LEFT, ArrowRight: DIR.RIGHT,
      w: DIR.UP, s: DIR.DOWN, a: DIR.LEFT, d: DIR.RIGHT,
      W: DIR.UP, S: DIR.DOWN, A: DIR.LEFT, D: DIR.RIGHT,
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === editorEl) return;
      if (!game) return;

      if (DIR_MAP[e.key]) {
        game.move(DIR_MAP[e.key]);
        if (game.phase === 'in_portal' && game.portalGame?.won) game._exitPortal();
        render(); e.preventDefault();
      } else if (e.key === 'z' || e.key === 'Z') {
        game.undo(); render();
      } else if (e.key === 'r' || e.key === 'R') {
        game.restart(); render();
      } else if (e.key === 'Backspace') {
        game.rewind(); render(); e.preventDefault();
      } else if (e.key === 'Tab') {
        game.switchBranch(); render(); e.preventDefault();
      } else if ('123'.includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        if (game.phase === 'merge_select') game.selectBranch(idx);
        else if (game.phase === 'delegate_select') game.selectInstruction(idx);
        render();
      } else if (e.key === 'Escape') {
        selectedTile = null;
        document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
        modeEl.textContent = '';
      }
    });

    // === Buttons ===
    document.getElementById('btnTest').addEventListener('click', () => {
      selectedTile = null;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
      modeEl.textContent = '试玩模式 (方向键操作)';
      parseAndRender();
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      if (game) { game.restart(); render(); }
    });
    document.getElementById('btnSolution').addEventListener('click', () => {
      parseAndRender();
      if (!levelDef?.solution || !game) {
        errorEl.textContent = '没有解法（在 # solution: 中定义）';
        return;
      }
      const DM = { w: DIR.UP, a: DIR.LEFT, s: DIR.DOWN, d: DIR.RIGHT };
      let i = 0;
      const sol = levelDef.solution;
      function step() {
        if (i >= sol.length || game.won) { render(); return; }
        const ch = sol[i++];
        if (DM[ch]) {
          const r = game.move(DM[ch]);
          if (!r.success && game.phase !== 'won') {
            errorEl.textContent = `解法失败: 步骤 ${i} '${ch}': ${r.reason}`;
            render(); return;
          }
        } else if (ch === '<') game.rewind();
        else if (ch === 't') game.switchBranch();
        else if ('123'.includes(ch)) {
          const idx = parseInt(ch) - 1;
          if (game.phase === 'merge_select') game.selectBranch(idx);
          else if (game.phase === 'delegate_select') game.selectInstruction(idx);
        }
        render();
        setTimeout(step, 150);
      }
      step();
    });

    // === Save button ===
    document.getElementById('btnSave').addEventListener('click', async () => {
      const levelName = loadSelect.value || '';
      let filename = levelName ? `${levelName}.txt` : '';
      if (!filename) {
        // 尝试从编辑器内容里找关卡名
        const match = editorEl.value.match(/\/\/\s*world:\s*(\S+)/);
        if (match) filename = `${match[1]}.txt`;
      }
      if (!filename) {
        errorEl.textContent = '请先从下拉菜单加载关卡，才能保存';
        return;
      }
      const content = editorEl.value;
      try {
        const resp = await fetch('http://localhost:3001/save-level', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, content }),
        });
        if (resp.ok) {
          statusEl.textContent = `✅ 已保存到 levels/${filename}`;
        } else {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || resp.statusText);
        }
      } catch (e) {
        // fallback: 下载文件
        console.warn('[save] 保存服务不可用，改为下载:', e.message);
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        statusEl.textContent = `⚠️ 保存服务不可用，已下载 ${filename}`;
      }
    });

    // Initial
    parseAndRender();
  </script>
</body>
</html>
